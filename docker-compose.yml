# Reading Room + Postgres (with pgvector), on http://localhost:3880
#
#   docker compose up -d --build
#
# API keys and settings come from .env.local (see .env.example); the
# database URL is set here, to the bundled Postgres. To use another
# database instead (e.g. Supabase), set DOCKER_DATABASE_URL in a .env file
# next to this one, or in your shell.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: reading-room
    # Only reachable from this computer. To open it to your network, use
    # "3880:3880" instead, and set APP_PASSWORD.
    ports:
      - "127.0.0.1:3880:3880"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://rag:rag@db:5432/rag}
    # Lets the app reach services running on this computer (e.g. a local
    # SearXNG) at http://host.docker.internal:<port> instead of localhost.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - models:/app/node_modules/@xenova/transformers/.cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  models:
